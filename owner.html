<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Portal Login | Samruddhi Agro</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/owner.css">
</head>

<body>
  <!-- Background -->
  <div class="login-bg-overlay"></div>

  <main class="login-wrapper">
    <!-- Back Button -->
    <a href="index.html" class="back-link">
      <svg class="back-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Portal selection</span>
    </a>

    <!-- Login Card -->
    <div class="login-card">
      <header class="login-header">
        <div class="brand-badge">OWNER PORTAL</div>
        <h1>Samruddhi Agro</h1>
        <p>Please enter your credentials to manage operations</p>
      </header>

      <form class="login-form"
        onsubmit="event.preventDefault(); alert('Authentication system is currently offline. Backend integration is pending.');">
        <div class="form-field">
          <label for="username">Email or Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <input type="text" id="username" placeholder="owner@samruddhiagro.com" required>
          </div>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span>Remember session</span>
          </label>
          <a href="#" class="forgot-pass" onclick="alert('Password recovery is not configured yet.');">Forgot
            password?</a>
        </div>

        <button type="submit" class="submit-login-btn">Sign In</button>
      </form>

      <div class="login-footer">
        <p>Authentication secured by local encryption. Pending Firebase Setup.</p>
      </div>
    </div>
  </main>
</body>

</html>
